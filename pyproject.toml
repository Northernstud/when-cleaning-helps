[project]
name = "data-corruption-cleaning-simulator"
version = "0.1.0"
description = "Simulation harness measuring when data cleaning actually helps a downstream model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebook", "app"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
